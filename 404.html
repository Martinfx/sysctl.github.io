<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — page not found · sysctl</title>
<meta name="description" content="That page does not exist on sysctl.cz. Head back to the FreeBSD SoC bring-up work, the boards, or the projects.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  try {
    var t = localStorage.getItem('sysctl-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  .nf { min-height: 100svh; display: grid; place-items: center; padding: 40px 0; }
  .nf__inner { max-width: 640px; text-align: left; }
  .nf__code {
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }
  .nf h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.035em; margin-bottom: 16px; }
  .nf p { color: var(--text-dim); margin-bottom: 28px; }
  .nf__links { display: flex; flex-wrap: wrap; gap: 12px; }
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<main class="nf">
  <div class="container nf__inner">
    <p class="nf__code">Error 404 — no such file or directory</p>
    <h1>That page never booted.</h1>
    <p>
      The address you followed doesn't exist here — most likely a stale link or a typo.
      Here is where to go instead.
    </p>
    <div class="nf__links">
      <a class="btn btn--primary" href="/">Back to the homepage</a>
      <a class="btn btn--ghost" href="/#boards">Boards</a>
      <a class="btn btn--ghost" href="/#projects">Projects</a>
      <a class="btn btn--ghost" href="https://github.com/Martinfx" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</main>
</body>
</html>
